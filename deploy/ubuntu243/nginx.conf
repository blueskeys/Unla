server {
    listen 80;
    server_name _;
    client_max_body_size 4m;
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://apiserver:5234;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /unla-test.json {
        default_type application/json;
        return 200 '{"status":"ok","service":"unla-connectivity-test"}';
    }
    location /gateway/ {
        proxy_pass http://gateway:5235/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    server_name 192.168.100.243;
    ssl_certificate /etc/unla-tls/server.crt;
    ssl_certificate_key /etc/unla-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://gateway:5235;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
