    method: "GET"
    endpoint: "https://ops.api.kindgem.net/api/refresh-jobs?limit=30&include_options=false"
    headers: {"Accept": "application/json", "Accept-Encoding": "identity"}
    annotations: {"readOnlyHint": true, "destructiveHint": false, "idempotentHint": true}
    args: [{"name": "offset", "position": "query", "type": "integer", "required": false, "description": "偏移量，默认0"}, {"name": "board_id", "position": "query", "type": "string", "required": false, "description": "可选货盘过滤，仍由上游校验范围"}, {"name": "room_id", "position": "query", "type": "string", "required": false, "description": "可选直播间过滤，不能扩大既有范围"}]
    responseBody: |-
      {"environment":"production","data":
      {{$d := fromJson .Response.Body}}{{if and (kindIs "map" $d) (kindIs "slice" $d.jobs) (hasKey $d "total")}}{"pagination":{{ $p := pick $d "offset" "limit" "total" "has_more" }}{{range $p}}{{if or (kindIs "map" .) (kindIs "slice" .)}}{{fail "LIVEOPS_SHAPE_REJECTED"}}{{end}}{{end}}{{toJSON $p}},"jobs":{{if not (kindIs "slice" $d.jobs)}}{{fail "LIVEOPS_SHAPE_REJECTED"}}{{end}}{{if gt (len $d.jobs) 30}}{{fail "LIVEOPS_ITEM_BUDGET_EXCEEDED"}}{{end}}[{{range $i,$v := $d.jobs}}{{if $i}},{{end}}{{if not (kindIs "map" $v)}}{{fail "LIVEOPS_SHAPE_REJECTED"}}{{end}}{{ $p := pick $v "id" "board_id" "board_name" "room_id" "room_name" "status" "scope" "total" "done" "created_at" "updated_at" }}{{range $p}}{{if or (kindIs "map" .) (kindIs "slice" .)}}{{fail "LIVEOPS_SHAPE_REJECTED"}}{{end}}{{end}}{{toJSON $p}}{{end}}]}{{else}}{{fail "LIVEOPS_QUERY_REJECTED"}}{{end}}
      }
  - name: liveops_get_fxg_catalog_status
    description: "production 生产环境：读取全局fxg商品目录数量、新鲜度和状态，要求external查询权限；不是某用户店铺商品，不刷新、不清理；不返回source_file或error；仅production。逐用户Bearer，30秒、原始/解压响应各4MiB、工具结果1MiB，超限明确失败，不截断冒充完整结果。"
    method: "GET"
    endpoint: "https://ops.api.kindgem.net/api/fxg-products/status"
    headers: {"Accept": "application/json", "Accept-Encoding": "identity"}
    annotations: {"readOnlyHint": true, "destructiveHint": false, "idempotentHint": true}
    responseBody: |-
      {"environment":"production","data":
      {{$d := fromJson .Response.Body}}{{if and (kindIs "map" $d) (eq $d.ok true) (kindIs "map" $d.state)}}{"scope":"global_fxg_catalog","catalog":{{ $p := pick $d "ok" "count" "stale" "ttl_seconds" }}{{range $p}}{{if or (kindIs "map" .) (kindIs "slice" .)}}{{fail "LIVEOPS_SHAPE_REJECTED"}}{{end}}{{end}}{{toJSON $p}},"state":{{ $p := pick $d.state "status" "total" "found_sku" "started_at" "finished_at" "updated_at" }}{{range $p}}{{if or (kindIs "map" .) (kindIs "slice" .)}}{{fail "LIVEOPS_SHAPE_REJECTED"}}{{end}}{{end}}{{toJSON $p}}}{{else}}{{fail "LIVEOPS_QUERY_REJECTED"}}{{end}}
      }
  - name: liveops_get_provider_execution_settings
    description: "production 生产环境：读取全局Provider执行设置，要求settings查询权限；只反映新任务的执行模式，不代表执行器在线或可用；仅production。逐用户Bearer，30秒、原始/解压响应各4MiB、工具结果1MiB，超限明确失败，不截断冒充完整结果。"
    method: "GET"
    endpoint: "https://ops.api.kindgem.net/api/settings/provider-execution"
    headers: {"Accept": "application/json", "Accept-Encoding": "identity"}
    annotations: {"readOnlyHint": true, "destructiveHint": false, "idempotentHint": true}
    responseBody: |-
      {"environment":"production","data":
      {{$d := fromJson .Response.Body}}{{if and (kindIs "map" $d) (hasKey $d "providerExecutionMode")}}{{ $p := pick $d "providerExecutionMode" "forced" "source" }}{{range $p}}{{if or (kindIs "map" .) (kindIs "slice" .)}}{{fail "LIVEOPS_SHAPE_REJECTED"}}{{end}}{{end}}{{toJSON $p}}{{else}}{{fail "LIVEOPS_QUERY_REJECTED"}}{{end}}
      }
  - name: liveops_get_client_update_metadata
    description: "production 生产环境：读取Windows x64客户端最新版本元数据，要求settings查询权限；上游读取配置的发布manifest并计算短期下载签名，不写业务、不下载客户端。签名URL和发布说明不返回；仅production。逐用户Bearer，30秒、原始/解压响应各4MiB、工具结果1MiB，超限明确失败，不截断冒充完整结果。"
    method: "GET"
    endpoint: "https://ops.api.kindgem.net/api/client-updates/latest?platform=windows&arch=x64"
    headers: {"Accept": "application/json", "Accept-Encoding": "identity"}
    annotations: {"readOnlyHint": true, "destructiveHint": false, "idempotentHint": true}
    responseBody: |-
      {"environment":"production","data":
      {{$d := fromJson .Response.Body}}{{if and (kindIs "map" $d) (hasKey $d "version") (eq $d.platform "windows") (eq $d.arch "x64")}}{{ $p := pick $d "version" "platform" "arch" "sha256" "size" }}{{range $p}}{{if or (kindIs "map" .) (kindIs "slice" .)}}{{fail "LIVEOPS_SHAPE_REJECTED"}}{{end}}{{end}}{{toJSON $p}}{{else}}{{fail "LIVEOPS_QUERY_REJECTED"}}{{end}}
      }
