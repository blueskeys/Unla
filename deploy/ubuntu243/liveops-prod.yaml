name: liveops-prod
tenant: default
routers:
  - server: liveops-prod
    prefix: /gateway/liveops-prod
    auth:
      mode: delegated_bearer
servers:
  - name: liveops-prod
    description: live-ops production 生产环境只读查询
    allowedTools:
      - liveops_list_boards
      - liveops_get_pallet_workspace
      - liveops_list_pallet_sessions
      - liveops_get_session_assortment
      - liveops_list_replays
tools:
  - name: liveops_list_boards
    description: production 生产环境：查询当前登录用户有权访问的货盘，每次返回前五条及总数。可以按货盘名称或编号搜索，不修改数据。
    method: GET
    endpoint: https://ops.api.kindgem.net/api/boards?kind=boards&page=1&page_size=5
    headers:
      Accept: application/json
      Accept-Encoding: identity
    args:
      - name: q
        position: query
        required: false
        type: string
        description: 货盘名称或编号搜索词，留空查询最近更新的五条。
    responseBody: |-
      {{ if hasKey .Response.Data "items" }}
      {"environment":"production","total":{{toJSON .Response.Data.total}},"page":{{toJSON .Response.Data.page}},"page_size":{{toJSON .Response.Data.page_size}},"items":[{{range $i,$b := fromJSON .Response.Data.items}}{{if $i}},{{end}}{"id":{{toJSON $b.id}},"name":{{toJSON $b.name}},"department":{{toJSON $b.bms_dept_name}},"goods_count":{{toJSON $b.goods_count}}}{{end}}]}
      {{ else }}
      {"error":"LIVEOPS_REQUEST_REJECTED","message":"货盘查询未成功，请核对当前用户登录状态与货盘查询权限。"}
      {{ end }}
  - name: liveops_get_pallet_workspace
    description: production 生产环境：查询指定货盘已有的直播间身份、排期设置、迁移状态和版本；不会创建工作空间。blocked 或不存在不能视为可排期。
    method: GET
    endpoint: https://ops.api.kindgem.net/api/boards/{{.Args.board_id}}/pallet-workspace
    headers: {Accept: application/json, Accept-Encoding: identity}
    annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true}
    args:
      - {name: board_id, position: path, required: true, type: string, description: 货盘列表返回的货盘ID}
    responseBody: |-
      {{$d := fromJson .Response.Body}}{{if hasKey $d "migration_status"}}{{toJSON (merge (dict "environment" "production") (pick $d "id" "board_id" "live_room_id" "default_start_time" "timezone" "weekly_rest_rule" "version" "migration_status" "migration_reason"))}}{{else}}{{fail "LIVEOPS_WORKSPACE_QUERY_REJECTED"}}{{end}}
  - name: liveops_list_pallet_sessions
    description: production 生产环境：查询指定货盘在日期闭区间内已存的计划场次，不自动创建或维护场次。日期格式YYYY-MM-DD，建议一次7天，最多日期差90天；空结果不表示休播。场次ID用于查询上播表。
    method: GET
    endpoint: https://ops.api.kindgem.net/api/boards/{{.Args.board_id}}/pallet-sessions
    headers: {Accept: application/json, Accept-Encoding: identity}
    annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true}
    args:
      - {name: board_id, position: path, required: true, type: string, description: 已确认有权限的货盘ID}
      - {name: from_date, position: query, required: true, type: string, description: 开始日期YYYY-MM-DD}
      - {name: through_date, position: query, required: true, type: string, description: 结束日期YYYY-MM-DD，不早于开始且日期差不超过90天}
    responseBody: |-
      {{$d := fromJson .Response.Body}}{{if kindIs "slice" $d}}
      {"environment":"production","total":{{len $d}},"items":[{{range $i,$s := $d}}{{if $i}},{{end}}{{toJSON (pick $s "id" "pallet_id" "business_date" "planned_start_at" "sequence_in_day" "kind" "status" "version")}}{{end}}]}
      {{else}}{{fail "LIVEOPS_SESSIONS_QUERY_REJECTED"}}{{end}}
  - name: liveops_get_session_assortment
    description: production 生产环境：查询指定货盘计划场次的上播表成员、顺序、锁定和版本，不是上品表，不含商品名称价格库存。not_generated表示尚未生成，不表示确认无商品。
    method: GET
    endpoint: https://ops.api.kindgem.net/api/boards/{{.Args.board_id}}/pallet-sessions/{{.Args.session_id}}/assortment
    headers: {Accept: application/json, Accept-Encoding: identity}
    annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true}
    args:
      - {name: board_id, position: path, required: true, type: string, description: 货盘ID}
      - {name: session_id, position: path, required: true, type: string, description: 此货盘的计划场次查询返回的ID}
    responseBody: |-
      {{$d := fromJson .Response.Body}}{{if hasKey $d "planned_session_id"}}
      {"environment":"production","planned_session_id":{{toJSON $d.planned_session_id}},"assortment_version":{{toJSON $d.assortment_version}},"generated_live_board_version":{{toJSON $d.generated_live_board_version}},"generation_status":{{toJSON $d.generation_status}},"total":{{len $d.items}},"items":[{{range $i,$g := $d.items}}{{if $i}},{{end}}{{toJSON (pick $g "planned_session_id" "goods_id" "role_at_session" "inclusion_source" "order_index" "is_temporary" "is_locked")}}{{end}}]}
      {{else}}{{fail "LIVEOPS_ASSORTMENT_QUERY_REJECTED"}}{{end}}
  - name: liveops_list_replays
    description: production 生产环境：查询当前用户可访问货盘最近20条直播归档摘要及监控指标，不启动监控或采集。无分页及总历史条数；这不是当前是否正在直播的查询。缺失指标表示未知，不能补零或将订单数解释为件数。
    method: GET
    endpoint: https://ops.api.kindgem.net/api/live-monitor/replays?limit=20
    headers: {Accept: application/json, Accept-Encoding: identity}
    annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true}
    responseBody: |-
      {{$d := fromJson .Response.Body}}{{if hasKey $d "items"}}
      {"environment":"production","limit":20,"returned":{{len $d.items}},"items":[{{range $i,$r := $d.items}}{{if $i}},{{end}}{"session_key":{{toJSON $r.session_key}},"board_id":{{toJSON $r.board_id}},"room_id":{{toJSON $r.room_id}},"name":{{toJSON $r.name}},"start_time":{{toJSON $r.start_time}},"ended_at":{{toJSON $r.ended_at}},"snapshot_count":{{toJSON $r.snapshot_count}},"latest":{{if and (kindIs "map" $r.latest) (kindIs "map" $r.latest.summary)}}{{toJSON (pick $r.latest.summary "live_title" "start_time" "duration" "live_status" "watch_ucnt" "pay_order_cnt" "pay_order_gmv_yuan" "fans" "fan_pay_ucnt_ratio" "fan_pay_amt_ratio")}}{{else}}null{{end}}}{{end}}]}
      {{else}}{{fail "LIVEOPS_REPLAYS_QUERY_REJECTED"}}{{end}}
